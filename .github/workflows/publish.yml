name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tag matches package version
        run: |
          VERSION="$(node -p "require('./packages/termdem/package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          fi

      - name: Build package
        run: pnpm --filter @akuederle/termdem build

      - name: Publish package
        run: |
          VERSION="$(node -p "require('./packages/termdem/package.json').version")"
          REGISTRY_VERSION="$(npm view @akuederle/termdem version 2>/dev/null || echo "0.0.0")"

          if [ "$VERSION" = "$REGISTRY_VERSION" ]; then
            echo "@akuederle/termdem@$VERSION is already published, skipping"
            exit 0
          fi

          TARBALL="$(cd packages/termdem && pnpm pack --pack-destination /tmp | tail -1)"
          npm publish "$TARBALL" --provenance --access public
