name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-and-test:
    name: Check and test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: apt-get update && apt-get install -y build-essential

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true

      - name: Build package for example typechecking
        run: vp run @akuederle/termdem#build

      - name: Check
        run: vp check

      - name: Test
        run: vp run -r test

      - name: Build
        run: vp run -r build

      - name: Smoke test examples
        run: vp run test:smoke
